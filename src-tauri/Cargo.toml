[package]
name = "salary-garden-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "salary_garden_core"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
rust_decimal = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
rust_decimal_macros = "1"
